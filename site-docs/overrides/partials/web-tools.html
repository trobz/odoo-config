{% macro links(cls) %}
  <a href="{{ base_url }}/web-tools/odoo-option-lookup/" class="{{ cls }}">
    <svg class="ov-btn__icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8" />
      <path d="m21 21-4.3-4.3" />
    </svg>
    Option lookup
  </a>
  <a href="{{ base_url }}/web-tools/odoo-option-matrix/" class="{{ cls }}">
    <svg class="ov-btn__icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="7" height="7" rx="1" />
      <rect x="14" y="3" width="7" height="7" rx="1" />
      <rect x="3" y="14" width="7" height="7" rx="1" />
      <rect x="14" y="14" width="7" height="7" rx="1" />
    </svg>
    Version matrix
  </a>
  <a href="{{ base_url }}/web-tools/odoo-conf-builder/" class="{{ cls }}">
    <svg class="ov-btn__icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="4" y1="21" x2="4" y2="14" />
      <line x1="4" y1="10" x2="4" y2="3" />
      <line x1="12" y1="21" x2="12" y2="12" />
      <line x1="12" y1="8" x2="12" y2="3" />
      <line x1="20" y1="21" x2="20" y2="16" />
      <line x1="20" y1="12" x2="20" y2="3" />
      <line x1="1" y1="14" x2="7" y2="14" />
      <line x1="9" y1="8" x2="15" y2="8" />
      <line x1="17" y1="16" x2="23" y2="16" />
    </svg>
    Config builder
  </a>
{% endmacro %}

{% macro menu() %}
  <div class="ov-tools__menu">
    <button type="button" class="ov-tools__toggle ov-btn ov-btn--tool" aria-expanded="false"
      aria-controls="ov-tools-panel" data-web-tools-toggle>
      Web tools
      <svg class="ov-tools__chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="m6 9 6 6 6-6" />
      </svg>
    </button>
    <div class="ov-tools__panel" id="ov-tools-panel" hidden>{{ links("ov-tools__link") }}</div>
  </div>
{% endmacro %}
